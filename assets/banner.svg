    <use href="#diagonal" transform="rotate(225)"/>
    <use href="#diagonal" transform="rotate(315)"/>
  </g>
</g></defs>
  <rect width="1200" height="300" fill="#12100E"/>
  <!-- Oversized mark bleeding off the right edge, the way the product's own
