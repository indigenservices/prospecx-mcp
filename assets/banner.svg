      <path id="cardinal" d="M 0 -8 C -16 -18, -22 -50, -16 -100 C -10 -140, -3 -148, 0 -148 C 3 -148, 10 -140, 16 -100 C 22 -50, 16 -18, 0 -8 Z"/>
    </g>
    <use href="#cardinal" transform="rotate(0)"/>
    <use href="#cardinal" transform="rotate(90)"/>
    <use href="#cardinal" transform="rotate(180)"/>
    <use href="#cardinal" transform="rotate(270)"/>
    <g>
      <path id="diagonal" d="M 0 -10 C -22 -20, -28 -52, -22 -90 C -16 -115, -4 -120, 0 -120 C 4 -120, 16 -115, 22 -90 C 28 -52, 22 -20, 0 -10 Z"/>
    </g>
    <use href="#diagonal" transform="rotate(45)"/>
