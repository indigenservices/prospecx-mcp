  <rect x="88" y="112" width="64" height="64" rx="16" fill="#FF5A1F"/>
  <g transform="translate(120 144) scale(0.1284)" fill="#F4ECDC"><use href="#petals"/></g>
  <text x="176" y="140" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="44" font-weight="600" fill="#F7F1E5" letter-spacing="-0.8">Prospecx MCP</text>
  <text x="178" y="172" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#9A9188" letter-spacing="1.5">RUN YOUR B2B PIPELINE FROM ANY MCP CLIENT</text>
  <g transform="translate(178 200)">
    <circle cx="5" cy="11" r="5" fill="#10B981"/>
    <text x="20" y="16" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F7F1E5">18 tools</text>
    <text x="106" y="16" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5E574F">/</text>
    <text x="124" y="16" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F7F1E5">OAuth 2.1</text>
    <text x="222" y="16" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5E574F">/</text>
    <text x="240" y="16" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F7F1E5">no API key to store</text>
